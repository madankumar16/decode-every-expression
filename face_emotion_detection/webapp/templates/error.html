{% extends "base.html" %}
{% block title %}{{ title }} — {{ site.name }}{% endblock %}
{% block description %}{{ message }}{% endblock %}
{% block robots %}<meta name="robots" content="noindex">{% endblock %}

{% block content %}
<div class="error-page">
    <p class="code">ERROR {{ code }}</p>
    <h1>{{ title }}</h1>
    <p class="lead">{{ message }}</p>
    <a class="btn" href="{{ url_for('home') }}">Back to home</a>
</div>
{% endblock %}
